# Deploys to the LIVE Firebase Hosting channel whenever changes are
# pushed/merged to the main branch.
#
# Setup required (one-time):
#   1. In the Firebase Console: Project Settings → Service Accounts →
#      "Generate new private key" — this downloads a JSON file.
#   2. In your GitHub repo: Settings → Secrets and variables → Actions →
#      "New repository secret":
#        Name:  FIREBASE_SERVICE_ACCOUNT
#        Value: paste the entire contents of that JSON file
#   3. Replace auto-recovery-b8d20 below with your actual Firebase
#      project ID (Project Settings → General → Project ID).
#
# That's it — every push to main will now auto-deploy.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTO_RECOVERY_B8D20 }}'
          channelId: live
          projectId: auto-recovery-b8d20
