# Creates a temporary PREVIEW deployment (its own throwaway URL) for every
# pull request, so changes can be reviewed live before merging to main.
# The preview channel is automatically deleted after a few days and never
# touches the live site.
#
# Uses the same FIREBASE_SERVICE_ACCOUNT secret as the merge workflow —
# see firebase-hosting-merge.yml for the one-time setup steps.

name: Deploy preview on pull request

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTO_RECOVERY_B8D20 }}'
          expires: 7d
          projectId: auto-recovery-b8d20
